<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>📊 Статистика прослушиваний</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #121212;
            color: #e0e0e0;
            font-family: 'YS Text', -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px;
            min-width: 320px;
            max-width: 380px;
            margin: 0 auto;
            user-select: none;
            -webkit-user-select: none;
        }
        .window-titlebar {
            -webkit-app-region: drag;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #2a2a2a;
            margin-bottom: 16px;
            cursor: move;
        }
        .window-titlebar h1 {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
        }
        .window-titlebar .close-btn {
            -webkit-app-region: no-drag;
            background: none;
            border: none;
            color: #888;
            font-size: 18px;
            cursor: pointer;
            padding: 0 6px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .window-titlebar .close-btn:hover {
            color: #ff6b6b;
            background: rgba(255,107,107,0.1);
        }
        .stats-total {
            text-align: center;
            padding: 10px 0 14px;
            font-size: 12px;
            color: #888;
            border-bottom: 1px solid #1e1e1e;
            margin-bottom: 14px;
        }
        .stats-total span {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            display: block;
            margin-top: 2px;
        }
        .stats-section {
            margin-bottom: 14px;
        }
        .stats-section h3 {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #555;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .stats-item {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            border-bottom: 1px solid #1a1a1a;
            font-size: 12px;
        }
        .stats-item .name {
            color: #ccc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70%;
        }
        .stats-item .count {
            color: #666;
            font-weight: 500;
        }
        .stats-empty {
            text-align: center;
            color: #555;
            padding: 20px 0;
            font-size: 13px;
        }
        .stats-actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #1e1e1e;
        }
        .stats-actions button {
            background: #222;
            border: none;
            color: #888;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .stats-actions button:hover {
            background: #333;
            color: #fff;
        }
        .stats-actions .danger:hover {
            background: #3a1a1a;
            color: #ff6b6b;
        }
        .footer {
            text-align: center;
            font-size: 8px;
            color: #333;
            margin-top: 10px;
            padding-top: 6px;
            border-top: 1px solid #1a1a1a;
        }
        #loading {
            text-align: center;
            color: #555;
            padding: 30px 0;
        }
    </style>
</head>
<body>
    <div class="window-titlebar">
        <h1>📊 Статистика</h1>
        <button class="close-btn" onclick="window.close()">✕</button>
    </div>
    <div id="content">
        <div id="loading">⏳ Загрузка...</div>
    </div>

    <script>
        // ===== ПОЛУЧАЕМ ДАННЫЕ ЧЕРЕЗ IPC =====
        async function loadStats() {
            try {
                // Пробуем получить данные через electronAPI
                if (window.electronAPI && window.electronAPI.getStats) {
                    const stats = await window.electronAPI.getStats();
                    renderStats(stats);
                } else {
                    // Фолбэк: пытаемся получить через localStorage (если окно открыто в том же контексте)
                    const data = localStorage.getItem('pulsesync_stats');
                    if (data) {
                        renderStats(JSON.parse(data));
                    } else {
                        document.getElementById('content').innerHTML = `
                            <div class="stats-empty">📭 Нет данных</div>
                        `;
                    }
                }
            } catch (e) {
                document.getElementById('content').innerHTML = `
                    <div class="stats-empty">⚠️ Ошибка загрузки</div>
                `;
                console.error('Stats window error:', e);
            }
        }

        function renderStats(stats) {
            const total = stats.tracks ? stats.tracks.length : 0;

            if (total === 0) {
                document.getElementById('content').innerHTML = `
                    <div class="stats-empty">🎵 Послушай пару треков</div>
                `;
                return;
            }

            // Подсчёт исполнителей
            const artists = {};
            stats.tracks.forEach(t => {
                const name = t.artist || 'Неизвестный исполнитель';
                artists[name] = (artists[name] || 0) + 1;
            });
            const sortedArtists = Object.entries(artists).sort((a, b) => b[1] - a[1]).slice(0, 10);

            // Подсчёт треков
            const tracks = {};
            stats.tracks.forEach(t => {
                const key = `${t.title} - ${t.artist}`;
                tracks[key] = (tracks[key] || 0) + 1;
            });
            const sortedTracks = Object.entries(tracks).sort((a, b) => b[1] - a[1]).slice(0, 10);

            // Статистика по дням
            const days = {};
            stats.tracks.forEach(t => {
                const day = t.timestamp.split('T')[0];
                days[day] = (days[day] || 0) + 1;
            });
            const sortedDays = Object.entries(days).sort().slice(-7);

            let html = `
                <div class="stats-total">
                    Всего треков
                    <span>${total}</span>
                </div>
                <div class="stats-section">
                    <h3>🏆 Топ исполнителей</h3>
                    ${sortedArtists.map(([artist, count]) => `
                        <div class="stats-item">
                            <span class="name">${artist}</span>
                            <span class="count">${count}</span>
                        </div>
                    `).join('')}
                </div>
                <div class="stats-section">
                    <h3>🎵 Топ треков</h3>
                    ${sortedTracks.map(([track, count]) => `
                        <div class="stats-item">
                            <span class="name">${track}</span>
                            <span class="count">${count}</span>
                        </div>
                    `).join('')}
                </div>
            `;

            if (sortedDays.length > 0) {
                html += `
                    <div class="stats-section">
                        <h3>📅 Последние дни</h3>
                        ${sortedDays.map(([day, count]) => `
                            <div class="stats-item">
                                <span class="name">${day}</span>
                                <span class="count">${count} треков</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            html += `
                <div class="stats-actions">
                    <button class="danger" onclick="window.opener?.clearStats?.(); window.close();">🗑️ Очистить</button>
                    <button onclick="window.opener?.exportStats?.();">📤 Экспорт</button>
                    <button onclick="window.location.reload();">🔄</button>
                </div>
                <div class="footer">wermaxyy • PulseSync Stats</div>
            `;

            document.getElementById('content').innerHTML = html;
        }

        // Загружаем статистику
        loadStats();

        // Подписываемся на обновления (если есть)
        if (window.electronAPI && window.electronAPI.onStatsUpdate) {
            window.electronAPI.onStatsUpdate((stats) => {
                renderStats(stats);
            });
        }
    </script>
</body>
</html>
